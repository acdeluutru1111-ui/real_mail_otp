# Alembic configuration for the real-mail-otp backend.
#
# The database URL is NOT hard-coded here; env.py loads it from
# app.core.config.get_settings().database_url (a single source of truth,
# consistent with Step 1). The url below is only a harmless placeholder.

[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder only; overridden in env.py from settings.
sqlalchemy.url = postgresql+asyncpg://localhost/placeholder

# Timezone-aware migration filenames.
timezone = UTC

[post_write_hooks]

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
